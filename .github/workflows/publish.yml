name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "仅演练打包与校验（不实际发布到 npm）"
        required: false
        default: false
        type: boolean

jobs:
  publish:
    name: Publish via Trusted Publishing (OIDC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC Trusted Publishing
        run: |
          npm install -g npm@latest
          node -v
          npm -v

      - name: Run plugin static checks
        run: |
          node --check lib/client.js
          node scripts/check-undefined.cjs lib/client.js

      - name: Verify release tag matches package.json
        if: github.event_name == 'release'
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TAG_VER="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG_VER tag=$TAG_VER"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "Version mismatch between package.json ($PKG_VER) and tag ($TAG_VER)"
            exit 1
          fi

      - name: Publish to npm
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --dry-run --access public
          else
            npm publish --access public --provenance
          fi
